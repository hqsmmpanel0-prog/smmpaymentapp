name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare project
        run: |
          mkdir proj
          if ls ./*.zip >/dev/null 2>&1; then
            unzip -q "$(ls ./*.zip | head -n1)" -d proj
          else
            rsync -a --exclude=proj --exclude=.git --exclude=.github ./ proj/
          fi
          GRADLE_FILE=$(find proj -name settings.gradle.kts | head -n1)
          if [ -z "$GRADLE_FILE" ]; then
            echo "settings.gradle.kts not found. Files in repo:"
            ls -R . | head -60
            exit 1
          fi
          echo "PROJ=$(dirname "$GRADLE_FILE")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: ${{ env.PROJ }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: SmmPaySync-APK
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/app-debug.apk
